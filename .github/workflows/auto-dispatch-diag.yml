name: Auto dispatch early-freeze diagnostic build

# One-shot helper: committing this file starts the kernel build with a build-time
# patch that makes boot_progress_stage() paint the latest stage synchronously.
# When that kernel run succeeds, it dispatches the EFI payload workflow with the
# exact run id. No large source file is rewritten in git for this diagnostic.
# Round 2: also picks up the bsd_init VFS_ROOT probe patch in patches/xnu/series.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-dispatch-diag.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-kernel:
    runs-on: ubuntu-latest
    outputs:
      kernel_run_id: ${{ steps.dispatch.outputs.id }}
    steps:
      - name: Dispatch kernel build with synchronous stage painting
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: SevenStar77777/UniXNU-rmx1901
          PRE_BUILD: |
            python3 - <<'PY'
            import os
            from pathlib import Path
            p = Path(os.environ['DEVICE_DIR']) / 'package/BootProgress.c'
            s = p.read_text()
            old1 = '''  bp_stage(&state,text,now);
              if (!started && !state.frozen) draw(now);
              release();
            }
            void boot_progress_process_stage(int pid,const char *name,const char *text) {'''
            new1 = '''  bp_stage(&state,text,now);
              // Once the monitor thread owns the panel, an IRQ-off hard lock stops all
              // refreshes and the screen keeps showing an old snapshot. Paint the latest
              // stage synchronously too, so the last stage before a freeze stays visible.
              if (started && display.bound) {
                capture(5,text);
                bp_line(&display,5,text,0xff00ffff);
              }
              if (!started && !state.frozen) draw(now);
              release();
            }
            void boot_progress_process_stage(int pid,const char *name,const char *text) {'''
            old2 = '''  snprintf(stamped,sizeof(stamped),"target pid=%d %.24s %.70s",pid,name,text);
              bp_stage(&state,stamped,now);
              if(!started && !state.frozen)draw(now);
              release();
            }'''
            new2 = '''  snprintf(stamped,sizeof(stamped),"target pid=%d %.24s %.70s",pid,name,text);
              bp_stage(&state,stamped,now);
              if (started && display.bound) {
                capture(5,stamped);
                bp_line(&display,5,stamped,0xff00ffff);
              }
              if(!started && !state.frozen)draw(now);
              release();
            }'''
            if s.count(old1) != 1 or s.count(old2) != 1:
                raise SystemExit('BootProgress.c patch anchors changed; refusing to guess')
            s = s.replace(old1, new1).replace(old2, new2)
            p.write_text(s)
            print('patched BootProgress.c: synchronous stage painting enabled')
            PY
        run: |
          set -euo pipefail
          before=$(gh api "repos/$REPO/actions/workflows/unixnu-kernel.yml/runs?per_page=1" --jq '.workflow_runs[0].id // empty')
          gh workflow run --repo "$REPO" unixnu-kernel.yml --ref main \
            -f device_repository="$REPO" \
            -f device_ref=main \
            -f unixnu_ref=main \
            -f defconfig=rmx1901_defconfig \
            -f steps=kernel \
            -f xcode=26.6 \
            -f pre_build="$PRE_BUILD"
          found=""
          for i in $(seq 1 30); do
            now=$(gh api "repos/$REPO/actions/workflows/unixnu-kernel.yml/runs?per_page=1" --jq '.workflow_runs[0].id // empty')
            if [ -n "$now" ] && [ "$now" != "$before" ]; then
              found="$now"
              break
            fi
            sleep 5
          done
          if [ -z "$found" ]; then
            echo "::error::no new kernel run appeared after dispatch"
            exit 1
          fi
          echo "new kernel run: $found"
          echo "id=$found" >> "$GITHUB_OUTPUT"

  dispatch-efi:
    needs: dispatch-kernel
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the exact kernel run and dispatch the payload volume
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: SevenStar77777/UniXNU-rmx1901
          KERNEL_RUN_ID: ${{ needs.dispatch-kernel.outputs.kernel_run_id }}
        run: |
          set -euo pipefail
          if [ -z "$KERNEL_RUN_ID" ]; then
            echo "::error::no kernel run id from dispatch-kernel"
            exit 1
          fi
          result=""
          for i in $(seq 1 240); do
            info=$(gh api "repos/$REPO/actions/runs/$KERNEL_RUN_ID")
            status=$(printf '%s' "$info" | jq -r '.status // empty')
            conclusion=$(printf '%s' "$info" | jq -r '.conclusion // empty')
            if [ "$status" = "completed" ]; then
              result="$conclusion"
              break
            fi
            sleep 30
          done
          if [ "$result" != "success" ]; then
            echo "::error::kernel run $KERNEL_RUN_ID did not succeed (result=${result:-timeout})"
            exit 1
          fi
          echo "kernel run $KERNEL_RUN_ID succeeded; dispatching payload volume"
          gh workflow run --repo "$REPO" unixnu-efi.yml --ref main -f kernel_run_id="$KERNEL_RUN_ID"
