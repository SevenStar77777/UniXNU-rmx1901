name: build-rmx1901

# Build the HakiOS loader with the RMX1901 board package, build U-Boot as the
# boot shim for this phone, and pack a RAM-boot Android boot image.
# Nothing here writes to a device.

on:
  workflow_dispatch:
  push:
    branches: [main, rmx1901, hackios-rmx1901-uefi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld make gcc-aarch64-linux-gnu \
            python3 python3-pip libssl-dev device-tree-compiler

      - name: Kernel checkout
        run: |
          git clone --depth 1 --branch common https://github.com/oosexgang/hakios-xnu-kernel.git "$RUNNER_TEMP/kernel"
          mkdir -p "$RUNNER_TEMP/kernel/arch/arm64/boot/dts/rmx1901"
          cp device/rmx1901/* "$RUNNER_TEMP/kernel/arch/arm64/boot/dts/rmx1901/"
          cd "$RUNNER_TEMP/kernel"
          HAKIOS_DEVICES="$RUNNER_TEMP/kernel/arch/arm64/boot/dts" PYTHONPATH=. python3 tools/boards.py check

      - name: Build loader.efi
        run: |
          cd "$RUNNER_TEMP/kernel"
          HAKIOS_DEVICES="$RUNNER_TEMP/kernel/arch/arm64/boot/dts" \
            arch/arm64/boot/build.sh
          mkdir -p "$GITHUB_WORKSPACE/build"
          cp arch/arm64/boot/loader.efi "$GITHUB_WORKSPACE/build/loader-rmx1901.efi"

      - name: Build U-Boot boot shim
        run: |
          source ./env.sh
          export KERNEL_ROOT="$RUNNER_TEMP/kernel"
          export DEVICE_FIRMWARE="$GITHUB_WORKSPACE/local-firmware"
          export HAKIOS_PROFILE_ROOT="$GITHUB_WORKSPACE/platform"
          u-boot/build.sh qualcomm/rmx1901

      - name: Pack boot.img and HKUB
        run: |
          DTB=$(find build/u-boot-rmx1901 -name '*.dtb' -print -quit)
          test -s "$DTB" || { echo "no U-Boot DTB was built" >&2; exit 1; }
          python3 u-boot/pack.py \
            --u-boot build/u-boot-rmx1901/u-boot.bin \
            --loader build/loader-rmx1901.efi \
            --dtb "$DTB" \
            --hkub-output build/hakios-rmx1901.hkub \
            -o build/hakios-rmx1901.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rmx1901-hakios
          path: |
            build/hakios-rmx1901.img
            build/hakios-rmx1901.hkub
            build/loader-rmx1901.efi
            build/u-boot-rmx1901/u-boot.bin
          if-no-files-found: error
