# Board description of realme X (RMX1901, SDM710), read by the UniXNU build driver.
# For the RMX1901 port: UFS first_lba=0x163908, blocks=0xC8A6F3 (4KiB).

schema_version = 2

[board]
name = "rmx1901"
soc = "SDM710"
soc_source = "sdm710"
os_profile = "ipados-17.7.11-21H461"
description = "realme X (RMX1901)"
kit = "rmx1901"

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[kernel]
defconfig = "rmx1901_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sdm710.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "build-rmx1901-probes.py",
  "build-boot-progress.py",
  "build-rmx1901-pmgr.py",
]

[device_tree]
source = "device:dts/rmx1901.dts"
include_dirs = ["soc:dts"]

[userdata]
first_lba = 0x163908
last_lba = 0xDEFDFA
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[payload]
volume = "RMX1901ESP"
size_mib = 128
loader = "payload"
title = "rmx1901 first boot: XNU to console"
dram_size = "0x7e2c0000"
panic_screen = false
kernel_args = [
  "-v",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "ml-timeout-lock-panic-scale=40",
  "-no_slto_panic",
  "boot-progress=2",
  "sheng-smp=1",
  "cpus=8",
  "armcpu-self-ipi=1",
  "armcpu-timer-intid=19",
  "sheng-pmgr=2",
  "amfi_get_out_of_my_way=1",
  "rd=ufsroot0",
  "ufsroot=userdata",
  "offline-apfs-load=1",
  "sheng-build-tag=rmx1901-m1",
]

[payload.adt]
chip_id = "8011"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
owned_memory_size = "0x20000000"

[adt.product.string]
model = "realme,rmx1901"

[adt.defaults.u32]
sleep-disabled = 1

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2
