  "vm-system boot sector is FAT32 (jump EB 58 90, boot sig 0x29 at 0x42, 512 B/sector, 32 sectors/cluster, 32 reserved sectors, 2 FATs, total 0x40000 sectors = 128 MiB). Its +0x400 region is all zero, confirming it is not ext2/3/4; use U-Boot fatls instead of raw superblock dumps.",
  "U-Boot 'fatls scsi 0:8 /' succeeds: root contains EFI/ directory and 0 files, confirming FAT driver reads the payload volume correctly.",
