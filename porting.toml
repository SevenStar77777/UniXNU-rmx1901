next_measurement = "内核侧 SHNGROOT 窗口发布驱动已实现并接入构建：package/Rmx1901WindowPublisher.cpp 按 gtaxllte NativeDwMmc 模式解析 SHNGROOT、发布 OS/SystemOS IOMedia、提供 root_authorized/volume_device/manifest_sha384 钩子；sweet-ufs-root.patch 导出 UFS 读/几何原语并计入请求计数。下一步推送触发 Actions 构建 kernel+payload，下载后经用户授权重刷 vm-system，验证 IOMedia UUID 与 APFS 根挂载；不再刷 boot 诊断镜像。"
