[[area]]
id = "kernel-first-console"
status = "device-verified"
inputs = [
  "kernel.macho built by Actions (rmx1901_defconfig, Xcode 26.6).",
  "Payload volume 128 MiB flashed to vm-system; bootcmd=bootefi bootmgr.",
  "Observed: '[rmx1901-a1] UniXNU boot diagnostics -- live XNU -- native 4K', CPU0 MPIDR=0x81000000, IODeviceTree 8192 bytes.",
  "Stuck at repeated 'vfs_mountroot enter': no root device.",
  "2026-11-27: bootefi bootmgr from vm-system EFI fallback path SUCCEEDED - BOOTAA64.EFI loaded and reached '[rmx1901-m1] UniXNU boot diagnostics - live XNU - native 4K', time=94s. U-Boot->UFS->FAT32->EFI->XNU chain is fully proven.",
  "Same boot still loops at 'vfs_mountroot enter' every ~5s. Panel bottom: 'UFS TIME verify=0 read=0 verified=0 blocks requests=0' and 'UFS step=25 spr=0/0 vfs=unset'. step=25 means sweet_ufs_rootdev got past step 3 then the vfs loop incremented ~19 times; vfs=unset means the diagnostic panel reads an empty native_vfs_names (weak-symbol copy in BootProgress vs kernel), not necessarily that XNU has no VFS. 'Kernel console ... an IRQ-off hard lock stops refresh' matches the known hard lock.",
  "2026-11-27 03:22 post-flash boot: still loops at vfs_mountroot; panel now 'UFS TIME verify=0 read=0 verified=0 blocks requests=0' and 'UFS step=15 apfs=0/0 vfs=(unset)', time=45s. step dropped 25->15 only because photographed earlier (45s/5s ~ 9 loop increments + 6), NOT evidence of progress. requests=0 means the sweet UFS driver published no block reads for APFS to consume.",
  "Root cause identified from source: this kernel has CONFIG_XNU_NATIVE_UFS=n and uses only patches/xnu/sweet-ufs-root.patch, whose sweet_ufs.c is a bare 512-byte block device over the whole userdata partition. That driver has NO SHNGROOT manifest parsing and never assigns native_ufs_blocks_published (declared once at patch line 226, never set). Therefore no OS/SystemOS windows are published as IOMedia, and APFS has no volume carrying root_match_volume_uuid to mount. Successful boards in UniXNU core (gtaxllte/orangepi5) publish each SHNGROOT window as its own IOBlockStorageDevice/IOMedia; this fork lacks that driver entirely.",
  "apfs=0/0 is NOT a failure: core scripts/check-original-apfs-checkpoints.py treats native_apfs_load_status==0 as genuine kext-load success. The missing piece is window publication + root-volume IOMedia, not APFS loading.",
  "Flashing userdata-root.img was still necessary and correct: the image is valid SHNGROOT v1 with matching UUID. But with the current kernel it cannot change the mount loop. Fix requires a kernel-side SHNGROOT window publisher (native UFS driver ported from core) plus kernel payload rebuild, NOT more boot-image flashes.",
]

[[area]]
id = "kernel-root-windows"
status = "implemented-flashed"
next_measurement = "2026-11-27 18:40 screenshot: bsd_init completed ('rmx probe: pre ROOTAUTH' -> devfs_kernel_mount -> siginit -> bsd_utaskbootstrap -> mountroot_post_hook -> 'bsd_init: done'), so the VFS_ROOT hard lock is CLEARED. The next blocker is pid1 init: two 'p1 init status=0 sig=0 exit=0 ns=0 sub=0' rows and no progress after exec. Follow 57UU/UniXNU-sirius (Xiaomi Mi 8 SE, same SDM710): build kernel.macho.trustcache from the two unchanged 21H461 IPSW modules and add launchdsuffix=release, then read the direct /sbin/launchd errno."
inputs = [
  "Rmx1901WindowPublisher.cpp is a board-started IOService personality (IOResources/IOBSD, guarded by XNU_RMX1901_ROOT_WINDOWS) that calls sweet_ufs_rootdev() before using the shared UFS read path.",
  "It validates the SHNGROOT v1/v2 header SHA-256, publishes SystemOS then OS as read-only 512-byte IOBlockStorageDevice windows, and increments native_ufs_blocks_published for each child.",
  "Root hooks follow the proven gtaxllte signatures: native_verified_block_root_authorized(dev_t), native_verified_block_volume_device(const char *, dev_t *, char *, size_t), native_verified_block_manifest_sha384(dev_t, const char *, uint8_t[48]). Device matching uses kIOBSDMajorKey/kIOBSDMinorKey and UUID matching uses IOMedia property matching, not a global scan.",
  "The 64 KiB staging buffer is now an IOBufferMemoryDescriptor owned by the publisher with an IOLock; no 68 KiB kernel-stack allocation remains.",
  "build-rmx1901-windows.py compiles with the recorded IOPlatformExpert ABI, audits the arm64/iOS 17 Mach-O object and archives libRmx1901Windows.a; rmx1901_defconfig force-loads it and defines the personality macro through build-xnu-4k-baseline.sh.",
  "rd=ufsroot0 was removed from board.toml kernel_args so IOKitBSDInit's /chosen/root-matching UUID path is not overridden; ufsroot=userdata remains as the UFS partition selector and vfs_subr keeps the bare-device fallback.",
  "2026-11-27 boot check: the kernel workflow's 'kernel payload' output is NOT bootable on its own - it contains only EFI/UniXNU/{unixnu.toml,Payloads/kernel.macho,.adt}. U-Boot bootefi bootmgr then reports 'Loading Boot0000..0005 scsi N failed' and falls to fastboot. The bootable volume must be produced by the unixnu-efi workflow (or scripts/make-uboot-payload.py), which adds EFI/BOOT/BOOTAA64.EFI (UniXNU.efi) and EFI/UniXNU/Payloads/DarwinBoot.efi.",
  "2026-11-27: unixnu-efi workflow run 12 (45957890062) consumed successful kernel run 45952297089 and produced D:/unixnu-build/run-efi/rmx1971-payload.img (134,217,728 B, SHA-256 3d2813f4594f734da308e88558e02e758daea7e51d27e44ed3496c89ba414cb0). Verified FAT contains BOOTAA64.EFI 110080 B, DarwinBoot.efi 28160 B, kernel.macho 52,518,912 B with Rmx1901WindowPublisher symbol, and unixnu.toml with rmx1901-root-windows=1 / rmx1901-allow-unverified=1 / sheng-build-tag=rmx1901-m2. User had already authorized reflashing vm-system; flashed OKAY.",
  "2026-11-27 15:37 and 15:46 device photos: both show the same frozen frame at time=1s, root=0, PROBE calls=0, TOPO cfg=0, UFS step=0 apfs=1/0 vfs=(unset), UFS TIME all zero. User confirmed the device was NOT rebooted between the photos. Therefore this is an IRQ-off hard lock around early PE/init, not merely an early snapshot and not a UFS/root failure yet.",
  "Diagnostic change in BootProgress.c: boot_progress_stage() and boot_progress_process_stage() now synchronously paint row 5 after bp_stage() when started && display.bound, so the last stage before a later freeze remains visible without waiting for the monitor thread.",
  "2026-11-27 18:40 device photo after the probe/rootauth build: time=27s IRQ=2892 monitor=26 lost=2, PROBE calls=17, and the stage timeline ends with 'bsd_init: done' after pre ROOTAUTH, devfs_kernel_mount, siginit, bsd_utaskbootstrap and mountroot_post_hook. Root auth bypass worked and the old VFS_ROOT hard lock is gone. UFS requests=384 while verify/read/verified times remain 0.",
  "The same photo shows two 'p1 init status=0 sig=0 exit=0 ns=0 sub=0' rows: pid1 init exits cleanly twice and never reaches userland. This is the exec/launchd stage, not the root/VFS stage.",
  "Reference case: 57UU/UniXNU-sirius (Xiaomi Mi 8 SE, SDM710, the same SoC family) documents root filesystem working (APFS disk2s1, bsd_init completes with sirius-skip-rootauth=1), then launchd working only after the payload carries the original trust cache bundle: build-original-system-trust.py emits StaticTrustCache + Cryptex1,SystemTrustCache as a version-2 bundle sha256 7416ca4f..., and 'execve activate 0' is observed. Without it AMFI kills launchd with namespace 9 / code 8 ('no external trust caches found').",
  "The sirius handoff also warns that amfi_get_out_of_my_way=1 alone does not supply the kernel exec signature check; the trust bundle is required. Its DEVELOPMENT boot arg launchdsuffix=release loads /sbin/launchd directly so the errno is visible; board.toml now adopts both that argument and the two accepted trust-cache digests, and unixnu-efi.yml now builds the bundle from the pinned IPSW with scripts/bundle-ipsw-trust.py.",
]

