  "LUN4 partitions 1-16 via part name: 1=xbl 2=sbl1 3=mup 4=modem 5=bluetooth 6=dsp 7=cdsp 8=ipa_fws 9=bluetooth 10=boot 11=cmnlib 12=cmnlib64 13=qupfw 14=vendor 15=vbmeta 16=vbmeta. boot is partition 10; later 21-34 are NV areas (sec/devinfo/apdp/msdp/splash/logfs/logdump).",
